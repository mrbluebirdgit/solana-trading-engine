name: Verify integrations

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      provider:
        description: Integration to verify
        required: true
        default: telegram
        type: choice
        options:
          - birdeye
          - gmgn
          - helius
          - jupiter
          - telegram
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: verify-integrations
  cancel-in-progress: false

jobs:
  verify-unit-tests:
    if: github.event_name == 'pull_request'
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

  verify-birdeye:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.provider == 'birdeye') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify birdeye')
    name: Verify Birdeye read-only configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Verify Birdeye read-only integration
        run: npm run verify:birdeye

  verify-gmgn:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.provider == 'gmgn') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify gmgn')
    name: Verify GMGN read-only configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Install pinned GMGN verifier
        run: npm install --global gmgn-cli@1.6.0

      - name: Verify GMGN read-only intelligence
        run: npm run verify:gmgn
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}

  verify-helius:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.provider == 'helius') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify helius')
    name: Verify Helius configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Verify Helius integration
        run: node scripts/verify-helius-live.mjs

  verify-jupiter:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.provider == 'jupiter') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify jupiter')
    name: Verify Jupiter read-only configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Verify Jupiter read-only integration
        run: npm run verify:jupiter

  verify-telegram:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.provider == 'telegram') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify telegram')
    name: Verify Telegram configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Verify Telegram integration
        run: node scripts/verify-integrations.mjs telegram
