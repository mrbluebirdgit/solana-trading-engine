name: Verify integrations

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Integration to verify
        required: true
        default: observer
        type: choice
        options:
          - birdeye
          - helius
          - jupiter
          - lunarcrush
          - newsapi
          - observer
          - x
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: verify-integrations
  cancel-in-progress: false

jobs:
  verify-birdeye:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.provider == 'birdeye') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify birdeye')
    name: Verify Birdeye read-only configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Verify Birdeye read-only integration
        run: npm run verify:birdeye
        env:
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}

  verify-helius:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.provider == 'helius') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify helius')
    name: Verify Helius configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Verify Helius integration
        run: node scripts/verify-helius-live.mjs
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}

  verify-jupiter:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.provider == 'jupiter') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify jupiter')
    name: Verify Jupiter read-only configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Verify Jupiter read-only integration
        run: npm run verify:jupiter
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}

  verify-observer:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.provider == 'observer') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify observer')
    name: Verify observer live dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Verify Helius WebSocket, Jupiter route, and Telegram Bot
        run: npm run verify:observer
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}

  verify-x:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.provider == 'x') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify x')
    name: Verify X read-only attention access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Verify X attention source
        run: npm run verify:x
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

  verify-lunarcrush:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.provider == 'lunarcrush') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify lunarcrush')
    name: Verify LunarCrush read-only attention access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Verify LunarCrush attention source
        run: npm run verify:lunarcrush
        env:
          LUNARCRUSH_API_KEY: ${{ secrets.LUNARCRUSH_API_KEY }}

  verify-newsapi:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.provider == 'newsapi') ||
      (github.event_name == 'issue_comment' &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/verify newsapi')
    name: Verify NewsAPI read-only attention access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Verify NewsAPI attention source
        run: npm run verify:newsapi
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
